name: Backend PostgreSQL integration

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-postgres.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartshopping
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: smartshopping_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartshopping -d smartshopping_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - run: cargo test --test postgres_sync -- --ignored --test-threads=1
        env:
          TEST_DATABASE_URL: postgres://smartshopping:test-only-password@localhost:5432/smartshopping_test
      - run: cargo test --test redis_security -- --ignored --test-threads=1
        env:
          TEST_REDIS_URL: redis://localhost:6379
