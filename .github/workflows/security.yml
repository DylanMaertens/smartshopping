name: Security checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with: { version: 11.25.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      # Lockfile audit: no package lifecycle scripts, no auto-fix or hidden advisory exceptions.
      - run: pnpm --dir mobile audit --audit-level low
  rust-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - run: rustup update stable --no-self-update
      - name: Guard active backend crypto dependencies
        run: |
          python3 -m unittest discover -s ops/tests -p 'test_backend_crypto_guard.py'
          python3 ops/check-backend-crypto.py --target x86_64-unknown-linux-gnu
      - run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - run: cargo +stable audit --file backend/Cargo.lock --deny warnings
  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: python -m pip install pip-audit==2.10.1
      # requirements contains the complete pinned OCR dependency tree.
      - run: python -m pip_audit --requirement backend/ocr/requirements.txt --no-deps --disable-pip
  leaked-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version: '1.25', cache: false }
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      # Never upload unredacted secret findings as artifacts.
      - run: gitleaks git --redact=100 --no-banner --log-opts="--all" .
