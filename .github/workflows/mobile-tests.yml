name: Mobile tests

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Standalone build configuration
        run: pnpm test:build-config
      - name: Unit tests and SQLite synchronization regressions
        run: pnpm test
      - name: React Native component regressions
        run: pnpm test:components
