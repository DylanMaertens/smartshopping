name: Mobile signed beta wave

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ops/check-beta-readiness.py --strict

  build:
    needs: readiness
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
        profile: [development, preview]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo-doctor
      - name: Queue signed build
        run: pnpm dlx eas-cli@16.17.4 build --profile "${{ matrix.profile }}" --platform "${{ matrix.platform }}" --non-interactive --no-wait --json | tee eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: eas-${{ matrix.profile }}-${{ matrix.platform }}
          path: mobile/eas-build.json
          retention-days: 30
