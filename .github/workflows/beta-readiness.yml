name: Beta readiness

on:
  pull_request:
    paths: ["beta/**", "ops/**", ".github/workflows/beta-readiness.yml"]
  workflow_dispatch:
    inputs:
      strict:
        description: Require all release evidence
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test evidence validation and collection
        run: python3 -B -m unittest discover -s ops/tests -v
      - name: Validate artifact schema
        run: python3 -B ops/check-beta-readiness.py --output beta-readiness-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-readiness-report
          path: beta-readiness-report.json
          retention-days: 30
      - name: Require complete evidence for a release dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.strict
        run: python3 ops/check-beta-readiness.py --strict
