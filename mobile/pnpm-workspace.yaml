# Allow only esbuild's platform-binary installation hook.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.13'
  - '@expo/metro-config@58.0.15'
  - '@expo/router-server@58.0.15'
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-camera@58.0.11
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo@58.0.16

# Security backports within the dependency's existing API branch. Keep scoped
# ranges: do not silently replace older CommonJS APIs with new major versions.
# Reviewed 2026-10-21; rationale and remaining advisories in docs/SECURITE_DEPENDANCES.md.
overrides:
  'postcss@>=8 <8.5.23': 8.5.23
  'undici@>=6 <6.28.1': 6.28.1
  'js-yaml@>=3 <3.15.2': 3.15.2
  'js-yaml@>=4 <4.3.2': 4.3.2
  'brace-expansion@>=1 <1.1.21': 1.1.21
  'brace-expansion@>=2 <2.1.7': 2.1.7
  'brace-expansion@>=5 <5.0.12': 5.0.12
  'tar@>=7 <7.5.21': 7.5.21
  'shell-quote@>=1 <1.11.0': 1.11.0
  'nanoid@>=3 <3.3.18': 3.3.18
  'browserslist@>=4 <4.28.7': 4.28.7
  '@xmldom/xmldom@>=0.8 <0.8.15': 0.8.15
  '@xmldom/xmldom@>=0.9 <0.9.12': 0.9.12
  'fast-uri@>=3 <3.1.8': 3.1.8
  'joi@>=17 <17.13.8': 17.13.8
  'baseline-browser-mapping@>=2 <2.11.0': 2.11.0
  'source-map-js@>=1 <1.2.2': 1.2.2
  'compression@>=1 <1.8.2': 1.8.2
  'vite@>=7 <7.3.7': 7.3.7
  # Narrow, tested tool-only major upgrades; not global API replacements.
  '@react-native-community/cli-platform-android@12.1.1>fast-xml-parser': 5.11.2
  '@react-native-community/cli-platform-ios@12.1.1>fast-xml-parser': 5.11.2
  'xcode@3.0.1>uuid': 11.1.1

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
  expo-camera@58.0.11: patches/expo-camera@58.0.11.patch
  ip@1.1.9: patches/ip@1.1.9.patch
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  sprintf-js@1.0.3: patches/sprintf-js@1.0.3.patch
