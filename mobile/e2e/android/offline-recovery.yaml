appId: com.smartshopping.app
---
- launchApp:
    clearState: true
- tapOn: "Ma liste"
- toggleAirplaneMode
- tapOn: "Ajouter un article"
- tapOn:
    id: add-item-input
- inputText: Riz
- tapOn:
    id: add-item-button
- tapOn: "Terminer"
- assertVisible: Riz
- stopApp
- launchApp
- tapOn: "Ma liste"
- assertVisible: Riz
- toggleAirplaneMode
# A local list must not start synchronizing when connectivity returns.
- assertNotVisible: "Synchroniser maintenant"
- assertVisible: Riz
