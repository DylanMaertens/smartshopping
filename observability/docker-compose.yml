services:
  backend:
    build: ../backend
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1536m
    cpus: 2.0
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777"]
    logging: &bounded-logs
      driver: local
      options: { max-size: "10m", max-file: "3" }
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      RUN_DATABASE_MIGRATIONS: "false"
      REQUIRE_RESTRICTED_DATABASE_ROLE: "true"
      REDIS_URL: redis://redis:6379
      ENABLE_SYNC_ENDPOINT: "true"
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      REQUIRE_DEVICE_SIGNATURES: "true"
      DEVICE_SECRET_KEY_FILE: /run/secrets/device_secret_key
      DEVICE_SECRET_PREVIOUS_KEY_FILE: /run/secrets/device_secret_previous_key
      DEVICE_REGISTRY_PATH: /data/device_registry.json
    ports: ["127.0.0.1:3000:3000"]
    networks: [default, data]
    volumes: ["backend-data:/data"]
    secrets: [database_url, metrics_token, device_secret_key, device_secret_previous_key]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  postgres:
    image: postgres:17-alpine
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    logging: *bounded-logs
    environment:
      POSTGRES_USER: smartshopping
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: smartshopping
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshopping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    secrets: [postgres_password]
  redis:
    image: redis:7-alpine
    user: redis
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    logging: *bounded-logs
    networks: [data]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
  prometheus:
    image: prom/prometheus:v3.5.0
    group_add: ["10001"] # shared read-only metrics secret, never the database secrets
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    logging: *bounded-logs
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [backend]
    secrets: [metrics_token]
  grafana:
    image: grafana/grafana:12.1.0
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    logging: *bounded-logs
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/smartshopping.json:ro
    depends_on: [prometheus]
    secrets: [grafana_admin_password]
  migrate:
    profiles: [maintenance]
    build: ../backend
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging: *bounded-logs
    command: ["migrate-db"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_migration_url
    secrets: [database_migration_url]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
networks:
  data:
    internal: true
volumes:
  backend-data:
  postgres-data:
secrets:
  database_migration_url: { file: ./secrets/database_migration_url }
  database_url: { file: ./secrets/database_url }
  metrics_token: { file: ./secrets/metrics_token }
  postgres_password: { file: ./secrets/postgres_password }
  grafana_admin_password: { file: ./secrets/grafana_admin_password }
  device_secret_key: { file: ./secrets/device_secret_key }
  device_secret_previous_key: { file: ./secrets/device_secret_previous_key }
